# Always-on service behind the page's refresh button. Deploy from the repo root:
#   fly deploy -c fly.web.toml --ha=false
# Separate from econ-data-cron (fly.toml) so cron.yml never picks this machine.
app = "econ-data-web"
primary_region = "iad"

[build]
  dockerfile = "web/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
